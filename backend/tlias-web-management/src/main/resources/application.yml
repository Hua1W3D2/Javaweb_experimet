# 1. Spring核心配置（顶级节点）
spring:
  application:
    name: tlias-web-management  # 应用名（正确缩进：属于spring.application）
  # 2. 数据源配置（属于spring的子节点，与application平级）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver  # 缩进：属于spring.datasource
    url: jdbc:mysql://localhost:3306/tilas?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 注意：URL需加参数（解决时区、SSL警告等问题，否则可能连不上数据库）
    username: root
    password: 123456
    web:
      resources:
        add-mappings: false
#阿里云ai配置
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
# 3. MyBatis配置（顶级节点，与spring平级，不要缩进在spring下）
mybatis:
  mapper-locations: classpath:mapper/*.xml  # 映射文件路径（属于mybatis）
  type-aliases-package: com.itheima.pojo    # 实体类包路径（属于mybatis）
  configuration:
    map-underscore-to-camel-case: true      # 下划线转驼峰（属于mybatis.configuration）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 日志实现（正确归属）
#spring事务管理日志

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
#阿里云OSS
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: java-ai-homework
    region: cn-beijing


server:
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8


